services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: chat-agent-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./database:/app/database
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chat-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped