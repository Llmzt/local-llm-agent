
<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8ff" />
    <title>agent1</title>
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">chat_agent</div>
          <div class="brand-subtitle">Local Agent</div>
        </div>

        <button id="newSessionButton" class="secondary-button" type="button">
          新会话
        </button>

        <div class="status-panel">
          <div class="panel-label">API</div>
          <div id="apiStatus" class="api-status">未连接</div>
        </div>

        <div class="session-actions">
          <button id="deleteSessionButton" class="danger-button" type="button">
            删除当前会话
          </button>
        </div>

        <div class="history-panel">
          <div class="panel-label">History</div>
          <div id="sessionList" class="session-list"></div>
        </div>
      </aside>

      <main class="chat-shell">
        <header class="chat-header">
          <div>
            <h1>Agent Chat</h1>
            <p>命令行 Agent 的 Web 对话界面</p>
          </div>
        </header>

        <section id="messages" class="messages"></section>

        <form id="chatForm" class="composer">
          <div class="input-wrap">
            <textarea
              id="messageInput"
              rows="2"
              placeholder="输入消息"
              autocomplete="off"
            ></textarea>
            <div class="shortcut-hint">Enter 发送，Shift + Enter 换行</div>
          </div>

          <button id="sendButton" type="submit" aria-label="发送消息">发送</button>
        </form>
      </main>
    </div>

    <div id="toastViewport" class="toast-viewport" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
